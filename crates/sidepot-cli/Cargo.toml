[package]
name = "sidepot-cli"
version = "0.1.0"
description = "Sign Sidepot entries and replay the game from L1 blocks"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sidepot-cli"
path = "src/main.rs"

[dependencies]
sidepot-core = { path = "../sidepot-core" }
secp256k1 = { version = "0.29", features = ["global-context"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
